[project]
name = "trag"
version = "0.1.0"
description = "Agentic RAG masterclass application"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "anthropic>=0.116",
    "langsmith>=0.1.140",
    "pyjwt[crypto]>=2.9",
    "httpx>=0.27",
    "supabase>=2.10",
    "python-multipart>=0.0.12",
]

[tool.uv]
# This repo is an application, not a distributable package. Without this, uv
# tries to build a `trag` package, finds no matching source directory, and fails.
package = false
